<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperLabs - Product Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a href="/" class="navbar-brand">SuperLabs</a>
      <a href="/" class="btn btn-outline-light btn-sm ms-auto">Back to listing</a>
    </div>
  </nav>

  <div class="container mb-5">
    <p id="loading">Loading...</p>
    <div id="errorMsg" class="alert alert-danger" style="display:none;"></div>
    <div id="productDetail" style="display:none;" class="row">
      <div class="col-md-5">
        <img id="productImage" class="img-fluid border" alt="">
      </div>
      <div class="col-md-7">
        <p id="productBrand" class="text-muted mb-1"></p>
        <h3 id="productName"></h3>
        <p id="productSku" class="text-muted small"></p>
        <h5 id="productPrice" class="text-success"></h5>
        <p id="productRating"></p>
        <p id="productAvailability"></p>
        <hr>
        <p id="productDescription"></p>
      </div>
    </div>
  </div>

  <script src="/js/productDetail.js"></script>
</body>
</html>
