<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperLabs - Product Listing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header py-3 mb-3">
    <div class="container header-row">
      <a href="/" class="site-logo">SuperLabs</a>
      <div class="header-search">
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">&#128269;</span>
          <input type="text" id="searchInput" class="form-control search-input" placeholder="Search by name or brand" autocomplete="off">
          <button type="button" id="clearSearchBtn" class="search-clear" title="Clear search" aria-label="Clear search">&times;</button>
        </div>
      </div>
      <div class="header-actions">
        <a class="btn btn-success btn-sm header-btn" href="/admin-create.html">Add Product</a>
        <a class="btn btn-outline-dark btn-sm header-btn" href="/admin.html">Admin</a>
      </div>
    </div>
  </header>

  <div class="container mb-5">
    <div class="row">
      <aside class="col-md-3 mb-3">
        <div class="filter-box p-3 border rounded">
          <h6>Brand</h6>
          <select id="brandFilter" class="form-select form-select-sm">
            <option value="">All brands</option>
          </select>
        </div>
      </aside>

      <main class="col-md-9">
        <div class="products-toolbar">
          <div>
            <h4 class="products-heading mb-0">Products</h4>
            <p class="mb-0 text-muted" id="resultCount">Loading...</p>
          </div>
          <select id="sortSelect" class="form-select form-select-sm sort-select">
            <option value="relevance">Sort by: Relevance</option>
            <option value="price">Sort by: Price</option>
          </select>
        </div>

        <div id="productList" class="row g-3"></div>

        <div class="pagination-bar mt-4">
          <p class="pagination-info text-muted mb-2" id="paginationInfo"></p>
          <nav aria-label="Product pages">
            <ul id="pagination" class="pagination mb-0"></ul>
          </nav>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/products.js"></script>
</body>
</html>
