<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperLabs - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">SuperLabs</a>
      <div class="ms-auto d-flex gap-2">
        <a class="btn btn-success btn-sm" href="/admin-create.html">Add Product</a>
        <a class="btn btn-outline-light btn-sm" href="/">Product Listing</a>
      </div>
    </div>
  </nav>

  <div class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Admin - Product List</h4>
      <a href="/admin-create.html" class="btn btn-primary">+ Add Product</a>
    </div>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Brand</th>
          <th>Price</th>
          <th>SKU</th>
          <th>Stock</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="adminTable"></tbody>
    </table>
  </div>

  <script src="/js/adminList.js"></script>
</body>
</html>
